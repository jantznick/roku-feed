<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Roku Feed Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">Internal viewer</p>
        <h1>Roku Feed</h1>
      </div>
      <button id="settingsBtn" class="ghost" type="button" aria-label="Settings">Feed</button>
    </header>

    <section id="settingsPanel" class="settings hidden">
      <label for="feedUrlInput">Feed URL</label>
      <input id="feedUrlInput" type="url" autocomplete="off" spellcheck="false" placeholder="https://…/feed.json" />
      <div class="row">
        <button id="saveFeedBtn" type="button">Save &amp; load</button>
        <button id="reloadBtn" class="ghost" type="button">Reload</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section id="playerSection" class="player-section hidden">
      <div class="player-shell">
        <video id="video" controls playsinline webkit-playsinline></video>
      </div>
      <div class="now-playing">
        <div>
          <p id="nowLeague" class="muted"></p>
          <h2 id="nowTitle"></h2>
        </div>
        <button id="closePlayerBtn" class="ghost" type="button">Close</button>
      </div>
      <div id="qualityRow" class="quality-row"></div>
    </section>

    <nav id="leagueNav" class="league-nav" aria-label="Leagues"></nav>
    <main id="gameList" class="game-list"></main>
  </div>
</body>
</html>
