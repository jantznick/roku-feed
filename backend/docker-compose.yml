# Auth stack: Postgres + API + settings web UI.
#
# From this directory (backend):
#   cp .env.example .env   # edit PUBLIC_* / FRONTEND_URL / APP_URL for your LAN
#   docker compose up --build
#
# Services:
#   db        → localhost:5432
#   api       → localhost:3001
#   frontend  → localhost:5173  (nginx serving the Vite production build)
#
# One-off Prisma:
#   docker compose run --rm api npx prisma generate
#   docker compose run --rm api npx prisma migrate deploy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rokufeed
      POSTGRES_PASSWORD: rokufeed
      POSTGRES_DB: roku_feed
    ports:
      - "5432:5432"
    volumes:
      - roku_feed_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokufeed -d roku_feed"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rokufeed:rokufeed@db:5432/roku_feed?schema=public
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle — use a host browsers on your LAN can reach
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  roku_feed_pg:
